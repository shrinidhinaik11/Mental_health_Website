<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindWell | Peace Wish</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            background:
                radial-gradient(circle at 20% 20%, #173b7a, transparent 35%),
                radial-gradient(circle at 80% 30%, #31206b, transparent 35%),
                radial-gradient(circle at 50% 90%, #071b45, #020817);

            color: white;

            overflow-x: hidden;
            overflow-y: auto;
        }


        .wish-container {
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 40px 20px;
        }


        .wish-card {

            width: 100%;
            max-width: 700px;

            border-radius: 30px;

            background: rgba(255, 255, 255, 0.08);

            backdrop-filter: blur(10px);

            border: 1px solid rgba(255, 255, 255, 0.2);

            box-shadow:
                0 0 40px rgba(80, 150, 255, 0.25);

            text-align: center;

            padding: 50px 30px;

        }


        #heading {

            font-size: 38px;

            font-weight: bold;

            color: white;

            margin-top: 10px;

        }


        .subtitle {

            color: #d9e8ff;

            font-size: 17px;

            margin-top: 15px;

        }


        #countdown {

            font-size: 100px;

            font-weight: bold;

            color: #ffe88a;

            margin-top: 50px;

            min-height: 130px;

            text-shadow:
                0 0 10px #ffe88a,
                0 0 30px #ffd84d;

            animation: countdownAnimation 1s ease;

        }


        @keyframes countdownAnimation {

            0% {
                transform: scale(0.4);
                opacity: 0;
            }

            50% {
                transform: scale(1.2);
                opacity: 1;
            }

            100% {
                transform: scale(1);
                opacity: 1;
            }

        }


        /* Peace message */

        #peaceMessage {

            display: none;

            animation: appear 2s ease forwards;

        }


        @keyframes appear {

            from {

                opacity: 0;

                transform: translateY(30px);

            }

            to {

                opacity: 1;

                transform: translateY(0);

            }

        }


        .peace-symbol {

            font-size: 55px;

            margin-bottom: 15px;

        }


        .peace-title {

            font-size: 32px;

            font-weight: bold;

            color: #ffe88a;

            text-shadow:
                0 0 10px #ffd95a,
                0 0 25px #ffd95a;

        }


        .mantra {

            font-size: 22px;

            line-height: 1.7;

            margin-top: 25px;

            color: white;

        }


        .happy-message {

            font-size: 20px;

            color: #d9e8ff;

            margin-top: 25px;

        }


        .heart {

            font-size: 55px;

            margin-top: 20px;

            animation: heartBeat 1.5s infinite;

        }


        @keyframes heartBeat {

            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.2);
            }

            100% {
                transform: scale(1);
            }

        }


        /* Small stars */

        .small-star {

            position: fixed;

            width: 4px;

            height: 4px;

            background: white;

            border-radius: 50%;

            box-shadow:
                0 0 6px white,
                0 0 12px #b9d8ff;

            animation: floatingStar 4s infinite ease-in-out;

        }


        @keyframes floatingStar {

            0% {

                transform:
                    translate(0, 0)
                    scale(0.5);

                opacity: 0.2;

            }

            50% {

                transform:
                    translate(25px, -30px)
                    scale(1.5);

                opacity: 1;

            }

            100% {

                transform:
                    translate(-20px, 25px)
                    scale(0.6);

                opacity: 0.2;

            }

        }


        .back-button {

            display: none;

            margin-top: 30px;

        }

    </style>

</head>


<body>


<!-- Small galaxy stars -->

<div class="small-star" style="left: 8%; top: 15%;"></div>

<div class="small-star"
     style="left: 20%; top: 70%; animation-delay: .5s;">
</div>

<div class="small-star"
     style="left: 35%; top: 25%; animation-delay: 1s;">
</div>

<div class="small-star"
     style="left: 50%; top: 85%; animation-delay: 1.5s;">
</div>

<div class="small-star"
     style="left: 65%; top: 15%; animation-delay: .8s;">
</div>

<div class="small-star"
     style="left: 78%; top: 65%; animation-delay: 1.2s;">
</div>

<div class="small-star"
     style="left: 90%; top: 30%; animation-delay: .3s;">
</div>


<div class="wish-container">

    <div class="card wish-card shadow">


        <h1 id="heading">

            Let Your Wishes Come True

        </h1>


        <p class="subtitle">

            Take a moment to breathe...
            and make a peaceful wish.

        </p>


        <!-- Countdown -->

        <div id="countdown">

            3

        </div>


        <!-- Peace Message -->

        <div id="peaceMessage">


        


            <p class="mantra">

                May your heart be filled with peace,
                your mind with positivity,
                and your life with happiness.

            </p>


            <p class="happy-message">

                Lead a happy life,
                one beautiful moment at a time.

            </p>


            


        </div>


        <div id="backButton" class="back-button">

            <a href="/" class="btn btn-light">

                Back to Home

            </a>

        </div>


    </div>

</div>


<script>


let countdown = document.getElementById("countdown");

let peaceMessage = document.getElementById("peaceMessage");

let backButton = document.getElementById("backButton");


/* 3 */

setTimeout(function() {

    countdown.innerHTML = "3";

}, 500);


/* 2 */

setTimeout(function() {

    countdown.innerHTML = "2";

}, 1500);


/* 1 */

setTimeout(function() {

    countdown.innerHTML = "1";

}, 2500);


/* Show Peace Mantra */

setTimeout(function() {

    countdown.style.display = "none";

    peaceMessage.style.display = "block";

}, 3500);


/* Back button */

setTimeout(function() {

    backButton.style.display = "block";

}, 5500);


</script>


</body>

</html>
