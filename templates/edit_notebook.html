
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Notebook Entry | MindWell</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <style>
        body {
            background-color: #f4f8f4;
            font-family: Arial, sans-serif;
        }

        .edit-card {
            max-width: 800px;
            margin: 50px auto;
            padding: 30px;
            background: white;
            border-radius: 16px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
        }

        .edit-title {
            color: #386641;
        }

        .form-control {
            border-radius: 10px;
            padding: 12px;
        }

        .save-btn {
            background-color: #386641;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 8px;
        }

        .save-btn:hover {
            background-color: #2d5034;
            color: white;
        }
    </style>
</head>

<body>
<div class="container">
    <div class="edit-card">

        <h2 class="edit-title text-center mb-4">
            Edit Your Feelings 🌿
        </h2>

        <form method="POST">

            <div class="mb-3">
                <label for="title" class="form-label">
                    Entry Title
                </label>

                <input type="text"
                       class="form-control"
                       id="title"
                       name="title"
                       value="{{ entry[1] or '' }}">
            </div>

            <div class="mb-3">
                <label for="feelings" class="form-label">
                    Your Feelings
                </label>

                <textarea class="form-control"
                          id="feelings"
                          name="feelings"
                          rows="8"
                          required>{{ entry[2] }}</textarea>
            </div>

            <div class="d-flex justify-content-center gap-2">
                <button type="submit" class="save-btn">
                    Save Changes
                </button>

                <a href="/feelings-notebook"
                   class="btn btn-outline-secondary">
                    Cancel
                </a>
            </div>

        </form>
    </div>
</div>
</body>
</html>
