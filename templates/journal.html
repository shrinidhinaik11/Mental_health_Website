<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MindWell | Journal</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css" rel="stylesheet">

    <!-- Custom CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Journal Section Starts -->

    <section class="journal-section">

        <div class="container">

            <h1 class="text-center text-success fw-bold mb-5">
                My Daily Journal ✍️
            </h1>

            <!-- 👇 PASTE THE FORM HERE 👇 -->

          <form method="POST">

                <div class="mb-3">

                    <label class="form-label">Journal Title</label>

                    <input type="text"
       name="title"
       class="form-control"
       placeholder="Enter journal title"
       required>

                </div>

                <div class="mb-3">

                    <label class="form-label">How was your day?</label>

                    <textarea
    name="journal"
    class="form-control"
    rows="6"
    placeholder="Write your thoughts here..."
    required></textarea>

                </div>

                <div class="mb-4">

                    <label class="form-label">Current Mood</label>

       <select
    name="mood"
    class="form-select">

    <option value="Happy">😊 Happy</option>
    <option value="Calm">😌 Calm</option>
    <option value="Neutral">😐 Neutral</option>
    <option value="Sad">😔 Sad</option>
    <option value="Stressed">😣 Stressed</option>

</select>

                </div>

                <button type="submit" class="btn btn-success">
    Save Journal
</button>

<a href="/view-journals" class="btn btn-primary ms-2">
    📖 View My Journals
</a>

            </form>

            <!-- 👆 FORM ENDS HERE 👆 -->

        </div>

    </section>

    <!-- Journal Section Ends -->

</body>

</html>
