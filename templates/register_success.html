<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome to MindWell</title>

    <link
        href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
        rel="stylesheet"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>

    <div class="container py-5">

        <div class="text-center mt-5">

            <h1 class="fw-bold text-success">
                Welcome to MindWell, {{ username }}! 🌿
            </h1>

            <p class="lead mt-3">
                Your account has been created successfully.
            </p>

            <p class="text-muted">
                We're happy to have you here. Take a moment for yourself,
                explore MindWell, and begin your wellness journey.
            </p>

            <div class="mt-4">

                <a href="/login" class="btn btn-success px-4">
                    Login to MindWell
                </a>

                <a href="/" class="btn btn-outline-success px-4 ms-2">
                    Back to Home
                </a>

            </div>

        </div>

    </div>

</body>
</html>
